    summary: "Anthropic's public Agent Skills: documents, design, MCP servers and skill authoring."
    publisher: { name: Anthropic, kind: builder, owner: anthropics, domain: anthropic.com }
    ownership: { method: github-verified-org, checked: "2026-10-03" }
    discovery:
      include: ["skills/**"]
    notes:
      - "Licences differ per skill; the Word, PDF, PowerPoint and Excel skills are proprietary."
    # Picks checked at ca45fc496a3436251f191354091d557da31c15b5 on 2026-10-30.
    picks:
      - skill: skills/frontend-design
        title: Frontend design
        gist: "Commit to a clear visual direction instead of default-looking UI."
        why: "Web frontends that need a point of view"
        tokens: 55
        applies_when:
          any:
            - tag: "framework:react"
            - tag: "framework:vue"
            - tag: "framework:angular"
            - tag: "framework:svelte"
            - tag: "framework:next"
      - skill: skills/mcp-builder
        title: MCP server builder
        gist: "Design MCP tools an agent can use well, then test them with real questions."
        why: "MCP server projects"
        tokens: 72
        scripts: true
        applies_when:
          any:
            - dependency: { name: "@modelcontextprotocol/sdk", ecosystem: npm }
            - dependency: { name: "@modelcontextprotocol/server", ecosystem: npm }
            - dependency: { name: mcp, ecosystem: pypi }
            - dependency: { name: fastmcp, ecosystem: pypi }
      - skill: skills/skill-creator
        title: Skill creator
        gist: "Draft a skill, run it on test prompts, and tighten when it triggers."
        why: "Repositories that publish agent skills"
        tokens: 83
        scripts: true
        # Skills the repository publishes, not ones installed into it.
        applies_when:
          any:
            - file: "skills/*/SKILL.md"
            - file: "skills/*/*/SKILL.md"
            - file: "plugins/*/skills/*/SKILL.md"
      - skill: skills/webapp-testing
        title: Web app testing
        gist: "Drive the running app in a real browser to check behaviour and read logs."
        why: "Web frontends you can run locally"
        tokens: 55
        scripts: true
        applies_when:
          any:
