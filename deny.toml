# cargo-deny: dependency licenses, advisories and sources. Run `cargo deny check`.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # proc-macro-error is unmaintained (not a vulnerability). It is a compile-time
  # macro crate reached only through Tauri's Linux GTK bindings (gtk-rs 0.18);
  # it goes away when Tauri moves to newer bindings.
  { id = "RUSTSEC-2024-0370", reason = "unmaintained build-time macro via tauri -> gtk 0.18; no fix available downstream" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "Unlicense",
  # File-level copyleft, used unmodified (servo CSS crates via Tauri, option-ext via directories).
  "MPL-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
