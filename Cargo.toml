[workspace]
resolver = "3"
members = ["crates/habi-core", "crates/habi-cli", "apps/desktop/src-tauri"]
default-members = ["crates/habi-core", "crates/habi-cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "Apache-2.0"
authors = ["Alvin Cris Tabontabon <me@acltabontabon.com>"]
repository = "https://github.com/acltabontabon/habi"
homepage = "https://github.com/acltabontabon/habi"

[workspace.dependencies]
dunce = "1.0.5"
habi-core = { path = "crates/habi-core" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
hex = "0.4.3"
ignore = "0.4.33"
jsonschema = { version = "0.58.4", default-features = false }
libc = "0.2.189"
regex = "1.13.1"
roxmltree = "0.21.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde-saphyr = "1.3.0"
sha2 = "0.11.0"
similar = "3.2.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde", "macros"] }
toml = "1.1.6"
toml_edit = "0.25.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
uuid = { version = "1.26.1", features = ["v4"] }
directories = "6.0.0"
which = "8.0.6"
tauri = "2.12.1"
tauri-build = "2.7.1"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
notify-debouncer-mini = "0.7.0"
ctrlc = "3.5.2"

[workspace.lints.rust]
# Unsafe code needs a scoped #[allow(unsafe_code)] with its reason.
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
