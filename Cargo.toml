[workspace]
resolver = "3"
members = ["crates/habi-core", "crates/habi-cli", "apps/desktop/src-tauri"]
default-members = ["crates/habi-core", "crates/habi-cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "Apache-2.0"
authors = ["Alvin Cris Tabontabon <me@acltabontabon.com>"]
repository = "https://github.com/acltabontabon/habi"
homepage = "https://github.com/acltabontabon/habi"

[workspace.dependencies]
dunce = "1.0.5"
crc32fast = "1.5.2"
flate2 = "1.1.10"
habi-core = { path = "crates/habi-core" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
hex = "0.4.3"
ignore = "0.4.33"
libc = "0.2.189"
regex = "1.13.1"
roxmltree = "0.21.1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde-saphyr = "2.0.0"
sha2 = "0.11.0"
similar = "3.2.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde", "macros"] }
toml = "1.1.6"
toml_edit = "0.25.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.26.1", features = ["v4"] }
directories = "6.0.0"
which = "8.0.6"
# Without the default `dynamic-acl`: capabilities are fixed when the app is built. Linux, which
# the other defaults are for, is not supported for the desktop app.
tauri = { version = "2.12.1", default-features = false, features = ["wry", "compression", "common-controls-v6"] }
tauri-build = "2.7.1"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
# The operating system's TLS (Security.framework, Schannel) rather than a bundled one.
# Updates use raw Windows installers and macOS tar archives; legacy ZIP support is unused.
tauri-plugin-updater = { version = "2.13.1", default-features = false, features = ["native-tls", "system-proxy"] }
notify-debouncer-mini = "0.7.0"
ctrlc = "3.5.2"

[workspace.lints.rust]
# Unsafe code needs a scoped #[allow(unsafe_code)] with its reason.
unsafe_code = "deny"

[profile.release]
# A fifth smaller than optimizing for speed, for 10-15% on work that is mostly file and database
# access. Panics still unwind: `Habi::open` relies on it to survive a bug in what it reads at start.
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
