name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do **not** report security problems here — see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest library and repository that show the problem help a lot.
      placeholder: |
        1. Connect library …
        2. Open project …
        3. …
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Desktop app
        - Website or documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Habi version and operating system
      placeholder: "0.1.0 on macOS 26 (arm64)"
    validations:
      required: true
  - type: input
    id: clients
    attributes:
      label: Agent tools involved (if any)
      placeholder: "Claude Code 2.x, Cursor 2.x, Gemini CLI …"
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic report (optional)
      description: >
        Settings → Diagnostics → Preview report (or `habi diagnostics`). It is redacted, but
        please read it before pasting.
      render: text
