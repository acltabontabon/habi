name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs the same checks before building a release. Installers are built there,
  # from a tag, and nowhere else.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which jobs a change needs, from the files it touches: a docs fix does not build Rust on two
  # operating systems. A release (a tag), a new branch, or a change to these workflows runs all.
  changes:
    name: What changed
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      frontend: ${{ steps.areas.outputs.frontend }}
      dependencies: ${{ steps.areas.outputs.dependencies }}
      website: ${{ steps.areas.outputs.website }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: areas
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          everything() {
            for area in rust frontend dependencies website; do echo "$area=true" >> "$GITHUB_OUTPUT"; done
          }
          if [ "$TAG" = "true" ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            everything
            exit 0
          fi
          files=$(git diff --name-only "$BASE"...HEAD)
          printf '%s\n' "$files"
          if grep -q '^\.github/workflows/' <<< "$files"; then
            everything
            exit 0
          fi
          touches() { grep -Eq "$1" <<< "$files" && echo true || echo false; }
          {
            echo "rust=$(touches '^(crates/|apps/desktop/src-tauri/|apps/desktop/src/bindings/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.cargo/|schema/|fixtures/|deny\.toml$)')"
            echo "frontend=$(touches '^(apps/desktop/(src/|public/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|vite\.config\.ts$|tsconfig\.json$|biome\.json$|index\.html$|node-shims\.d\.ts$)|CHANGELOG\.md$|scripts/changelog\.mjs$)')"
            echo "dependencies=$(touches '(^|/)(Cargo\.(toml|lock)|package\.json|pnpm-lock\.yaml)$|^deny\.toml$|^THIRD_PARTY_NOTICES\.md$|^scripts/third-party-notices\.mjs$')"
            echo "website=$(touches '^(website/|docs/|README\.md$|CHANGELOG\.md$)')"
          } >> "$GITHUB_OUTPUT"

  core:
    name: Rust core and CLI (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Configure Git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The bindings are generated. Removing them first means `cargo test` writes every file
      # from scratch, so a file left behind for a removed type shows up as deleted below.
      - name: Remove generated TypeScript bindings
        if: runner.os != 'Windows'
        shell: bash
        run: rm -rf apps/desktop/src/bindings
      - run: cargo test --workspace --no-fail-fast
      - name: TypeScript bindings are up to date
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Lists modified, deleted and new files alike.
          if [ -n "$(git status --porcelain --untracked-files=all -- apps/desktop/src/bindings)" ]; then
            git status --short -- apps/desktop/src/bindings
            echo "::error::Rust types changed: run cargo test and commit apps/desktop/src/bindings"
            exit 1
          fi

  # Plain TypeScript and a browser test environment: one Linux run says what two would.
  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  website:
    name: Website
    # website.yml builds and deploys on main; here it only guards pull requests. The site renders
    # docs/, so a broken link in a guide fails here first.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.website == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  licenses:
    name: Licenses and notices
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses advisories sources
          rust-version: "1.98.1"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10
        with:
          toolchain: "1.98.1"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: THIRD_PARTY_NOTICES.md is up to date
        run: node scripts/third-party-notices.mjs --check

  docs:
    name: Documentation links
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: node scripts/check-links.mjs
      # CHANGELOG.md's format, and the update manifest the release publishes.
      - run: node --test scripts/*.test.mjs
