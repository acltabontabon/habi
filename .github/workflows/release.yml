name: Release

# Pushing a tag vX.Y.Z runs every CI check, confirms the tag matches the version in each
# manifest and that CHANGELOG.md has an entry for it, builds the installers (signed for Habi's
# own updater) and the `habi` command-line tool for macOS (one universal build) and Windows, and
# creates a draft release with the update manifest (latest.json). See docs/dev/release.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    name: CI checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  version:
    name: Tag matches the version
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Compare the tag with every manifest
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          desktop=$(node -p 'require("./apps/desktop/package.json").version')
          tauri=$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").version')
          website=$(node -p 'require("./website/package.json").version')
          status=0
          for entry in "Cargo.toml=$cargo" "apps/desktop/package.json=$desktop" \
                       "apps/desktop/src-tauri/tauri.conf.json=$tauri" "website/package.json=$website"; do
            if [ "${entry#*=}" != "$tag" ]; then
              echo "::error::${entry%%=*} has version '${entry#*=}', but the tag is v$tag"
              status=1
            fi
          done
          exit "$status"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: CHANGELOG.md has an entry for this version
        run: node scripts/updater-manifest.mjs --check "$GITHUB_REF_NAME"

  build:
    name: Build (${{ matrix.platform }})
    needs: [checks, version]
    timeout-minutes: 90
    # Habi ships for macOS and Windows; Linux is not a release target.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-15
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin
          - platform: windows
            os: windows-2025
            rust-targets: ""
            tauri-args: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # build provenance attestations
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.rust-targets }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      # The installers are not signed by Apple or Microsoft, by choice (docs/dev/release.md).
      # Installed copies of Habi only accept an update signed by this key; without it a release
      # could never be installed by the people already running Habi. It is not Apple or Windows
      # code signing: generate it once with `pnpm tauri signer generate`.
      - name: Updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set: without it people cannot update to this release. See docs/dev/release.md."
            exit 1
          fi
      - name: Build desktop installers
        shell: bash
        env:
          TAURI_ARGS: ${{ matrix.tauri-args }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          read -ra args <<< "$TAURI_ARGS"
          # Updater artifacts (and their signatures) are made for releases only, so local and CI
          # builds do not need the key.
          pnpm tauri build "${args[@]}" --config '{"bundle":{"createUpdaterArtifacts":true}}'
        working-directory: apps/desktop
      - name: Build command-line tool (macOS, universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked -p habi-cli --target aarch64-apple-darwin
          cargo build --release --locked -p habi-cli --target x86_64-apple-darwin
          mkdir -p target/cli
          lipo -create -output target/cli/habi \
            target/aarch64-apple-darwin/release/habi target/x86_64-apple-darwin/release/habi
          echo "CLI_TARGET=universal-apple-darwin" >> "$GITHUB_ENV"
      - name: Build command-line tool (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --locked -p habi-cli
          mkdir -p target/cli
          cp target/release/habi.exe target/cli/
          echo "CLI_TARGET=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_ENV"
      - name: Collect artifacts and checksums
        shell: bash
        run: |
          # The globs below only match file names this job wrote, none starting with a dash.
          mkdir -p dist
          find target -type f -path '*/release/bundle/*' \
            \( -name "*.dmg" -o -name "*.msi" -o -name "*-setup.exe" -o -name "*-setup.exe.sig" \) -exec cp {} dist/ \;
          # The macOS update is the zipped app; named by version and architecture like the rest.
          for f in $(find target -type f -path '*/release/bundle/macos/*' -name '*.app.tar.gz*'); do
            cp "$f" "dist/Habi_${GITHUB_REF_NAME#v}_universal.${f##*/Habi.}"
          done
          # shellcheck disable=SC2035
          (cd target/cli && tar -czf "../../dist/habi-cli-${GITHUB_REF_NAME}-${CLI_TARGET}.tar.gz" *)
          cd dist
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          # shellcheck disable=SC2035
          $sum * > "SHA256SUMS-${{ matrix.platform }}.txt"
          cat "SHA256SUMS-${{ matrix.platform }}.txt"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Draft GitHub release
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      # latest.json is what running copies of Habi ask for; the release notes are this version's
      # section of CHANGELOG.md, so the release, the update and What's new always agree.
      - name: Update manifest and release text
        shell: bash
        run: |
          node scripts/updater-manifest.mjs "$GITHUB_REF_NAME" dist "$GITHUB_REPOSITORY"
          mv dist/release-notes.md "$RUNNER_TEMP/release-notes.md"
          {
            cat "$RUNNER_TEMP/release-notes.md"
            printf '\n---\n\n'
            printf 'Draft release: check docs/dev/release.md before publishing. Publishing it is what\n'
            printf 'offers it to people already running Habi (`latest.json`).\n\n'
            printf 'The installers are not signed by Apple or Microsoft. Opening them the first time:\n'
            printf 'https://acltabontabon.com/habi/docs/getting-started/#installing\n\n'
            printf 'Checksums: SHA256SUMS-macos.txt and SHA256SUMS-windows.txt. Verify provenance with\n'
            printf '`gh attestation verify <file> --repo acltabontabon/habi`.\n'
          } > "$RUNNER_TEMP/body.md"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          body_path: ${{ runner.temp }}/body.md
          files: dist/*
